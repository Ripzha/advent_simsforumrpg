<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimsWelt News — Durchlauf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   SIMSWELT NEWS — Durchlauf
   Spielt die fertigen Blöcke nacheinander ab. Der jeweils nächste
   wird im Hintergrund geladen, damit beim Schnitt nichts hakt.
   Die einzelnen Seiten bleiben unverändert — sie laufen in einem
   Rahmen und werden von hier aus gestartet und überwacht.
   =================================================================== */

:root {
  --nacht:       #040a14;
  --navy:        #08192e;
  --silber:      #c9d6e4;
  --weiss:       #ffffff;
  --messing:     #c9992f;
  --messing-hell:#e8c877;
  --marke: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --eng:   "Barlow Condensed", "Arial Narrow", sans-serif;
  --text:  "Barlow", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #02060c; font-family: var(--text); color: var(--weiss);
  overflow: hidden;
}

/* ---------- Bühne mit den Rahmen ---------- */
.bühne {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #02060c;
}
.feld {
  position: relative; aspect-ratio: 16 / 9;
  width: min(100vw, calc(100vh * 16 / 9)); height: auto;
  background: #000; overflow: hidden;
}
.feld iframe {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; opacity: 0; transition: opacity 0.6s ease;
  pointer-events: none;
}
.feld iframe.vorn { opacity: 1; pointer-events: auto; }
/* Rahmen, die weder laufen noch als naechste dran sind, werden ganz
   aus der Darstellung genommen — sonst rechnen vierzehn Seiten
   gleichzeitig an ihren Bildfahrten und das Handy wird heiss. */
.feld iframe.schlaeft { display: none; }

/* ---------- Übergangsblende ---------- */
.blende {
  position: absolute; inset: 0; z-index: 40; background: #000;
  opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
}
.blende.an { opacity: 1; }

/* ---------- Wischer zwischen den Bloecken ----------
   Der Globus laeuft eine Sekunde lang ueber das ganze Feld und deckt
   dabei den Rahmenwechsel zu. Liegt ueber der Blende, damit darunter
   in Ruhe geladen werden kann. */
.wischer {
  position: absolute; inset: 0; z-index: 42;
  width: 100%; height: 100%; object-fit: cover; background: #000;
  opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
}
.wischer.an { opacity: 1; }
/* Die Senderkennung blendet selbst aus Schwarz auf und wieder weg.
   Eine zweite Blende darueber macht sie traege. */
#kennvideo { transition: none; }

/* Der Globus laeuft UEBER das Bild, nicht an seiner Stelle. Sein Grund
   ist fast schwarz (im Mittel RGB 2/5/10), mit screen faellt er deshalb
   weg und nur die goldenen Linien stehen ueber der laufenden Sendung.
   Darunter blenden die beiden Rahmen ineinander. */
#wischer { mix-blend-mode: screen; background: transparent; }
/* Eigene Ebene fuer die Vorlaeufe, damit das Mischen den Rest nicht bremst */
.wischer { will-change: opacity; transform: translateZ(0); }

/* ---------- Ladeanzeige ---------- */
.laden {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 45; text-align: center; display: none;
}
.laden.an { display: block; }
.laden b {
  display: block; font-family: var(--marke); font-weight: 800;
  font-size: clamp(16px, 2.2vw, 34px); color: var(--weiss);
}
.laden span {
  display: block; margin-top: 0.5em; font-family: var(--eng); font-weight: 600;
  font-size: clamp(10px, 1.1vw, 17px); letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--messing-hell);
}
.laden .balken {
  width: 14em; height: 3px; margin: 1.1em auto 0; background: rgba(201,214,228,0.2);
  overflow: hidden;
}
.laden .balken i {
  display: block; height: 100%; width: 40%; background: var(--messing);
  animation: wandern 1.1s ease-in-out infinite;
}
@keyframes wandern {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}

/* ---------- Leiste unten ---------- */
.leiste {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 60;
  display: flex; align-items: center; gap: 1em; padding: 0.55em 1.1em 0.65em;
  background: linear-gradient(0deg, rgba(4,10,20,0.96), rgba(4,10,20,0.55));
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
  color: var(--messing-hell);
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
.leiste.zeig { opacity: 1; pointer-events: auto; }
.leiste .stand { flex: 0 0 auto; min-width: 16em; }
.leiste .kette { flex: 1 1 auto; display: flex; gap: 3px; }
.leiste .kette span {
  flex: 1 1 0; height: 14px; background: rgba(201,214,228,0.16); cursor: pointer;
  position: relative; overflow: hidden;
  /* Kurze Tuerchen wie 19b oder 20b waeren sonst zwei Pixel breit und
     nicht anklickbar — die Breite richtet sich nach der Laenge, aber
     eine Marke muss man treffen koennen. */
  min-width: 9px;
}
.leiste .kette span.fertig { background: rgba(201,153,47,0.45); }
.leiste .kette span.jetzt  { background: rgba(201,214,228,0.16); }
.leiste .kette span.jetzt i {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--messing);
}
.leiste button {
  flex: 0 0 auto; font-family: inherit; font-size: 11px; letter-spacing: 0.06em;
  color: var(--nacht); background: var(--messing-hell); border: none;
  padding: 0.45em 0.9em; cursor: pointer;
}
.leiste button:hover { background: var(--weiss); }
.leiste .hinweis { flex: 0 0 auto; color: var(--silber); }

/* Auf dem Handy gibt es keine Maus: die Leiste kommt beim Tippen und
   muss mit dem Finger treffbar sein. Der Hinweistext hat da keinen
   Platz, und die Blockkette sitzt in einer eigenen Zeile. */
@media (max-width: 760px), (pointer: coarse) {
  .leiste {
    flex-wrap: wrap; gap: 0.5em 0.7em; padding: 0.6em 0.7em 0.9em;
  }
  .leiste .hinweis { display: none; }
  .leiste .stand { order: 1; min-width: 0; flex: 1 1 auto; font-size: 11px; }
  .leiste .kette { order: 3; flex: 1 1 100%; }
  .leiste .kette span { height: 22px; min-width: 14px; }
  .leiste button {
    order: 2; font-size: 13px; padding: 0.7em 1.05em;
    min-width: 3.6em; min-height: 44px;      /* Fingerbreite */
  }
}

/* ---------- Startbildschirm ---------- */
.start {
  position: absolute; inset: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.2rem; padding: 2rem;
  background: radial-gradient(ellipse at 50% 44%, #16314f 0%, #0a1c33 44%, #040a14 100%);
  transition: opacity 0.45s ease, visibility 0.45s ease;
}
.start.weg { opacity: 0; visibility: hidden; }
.raute { display: inline-block; position: relative; width: .30em; height: .62em; margin: 0 .085em; }
.raute::before { content: ""; position: absolute; inset: 0;   background: var(--messing); clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
.raute::after  { content: ""; position: absolute; inset: 22%; background: var(--nacht);   clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
.start h1 {
  margin: 0; font-family: var(--marke); font-weight: 800;
  font-size: clamp(26px, 5vw, 78px); letter-spacing: -0.012em;
  color: var(--weiss); display: flex; align-items: baseline;
}
.start h1 .news { color: var(--messing-hell); }
.start .linie { width: 38%; height: 2px; background: var(--messing); }
.start p {
  margin: 0; font-family: var(--eng); font-weight: 600;
  font-size: clamp(11px, 1.3vw, 20px); letter-spacing: 0.4em;
  text-indent: 0.4em; text-transform: uppercase; color: rgba(201,214,228,0.82);
}
/* Ein Knopf, und der soll gross sein: das hier ist eine Sendung,
   kein Videoschrank, aus dem man sich Stuecke herausklickt. */
.start button {
  margin-top: 0.6rem;
  font-family: var(--eng); font-weight: 700; font-size: clamp(16px, 2vw, 30px);
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--nacht);
  background: var(--messing); border: none;
  padding: 0.95em 2.6em; cursor: pointer; border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(201,153,47,0.5), 0 0 44px rgba(201,153,47,0.28);
  transition: transform 0.15s ease, background 0.2s ease;
}
.start button:hover { background: var(--messing-hell); transform: translateY(-1px); }
.start button:active { transform: translateY(1px); }

/* Tippaufforderung — nur wenn der Browser den Ton sperrt */
.tipp {
  position: absolute; inset: 0; z-index: 95; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
  background: rgba(4,10,20,0.92); border: none; width: 100%;
  font-family: var(--eng); font-weight: 700; font-size: clamp(15px, 2vw, 26px);
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--messing-hell);
  cursor: pointer;
}
.tipp.an { display: flex; }
.tipp i {
  display: block; width: 4.4rem; height: 4.4rem; border-radius: 50%;
  background: var(--messing); position: relative;
}
.tipp i::after {
  content: ""; position: absolute; left: 38%; top: 28%;
  border-left: 1.35rem solid var(--nacht);
  border-top: 0.95rem solid transparent; border-bottom: 0.95rem solid transparent;
}
.tipp small { font-family: var(--text); font-size: 13px; letter-spacing: 0;
              text-transform: none; color: rgba(201,214,228,0.6); }
.start small {
  font-family: var(--text); font-size: clamp(10px, 0.95vw, 13px);
  color: rgba(201,214,228,0.5); text-align: center; max-width: 42em;
}
</style>
</head>
<body>

<div class="bühne">
  <div class="feld" id="feld">
    <div class="blende" id="blende"></div>
    <video class="wischer" id="wischer" muted playsinline preload="auto"></video>
    <video class="wischer" id="kennvideo" playsinline preload="auto"></video>
    <video class="wischer" id="rueckvideo" playsinline preload="auto"></video>
    <div class="laden" id="laden">
      <b id="laden-titel"></b>
      <span id="laden-nummer"></span>
      <div class="balken"><i></i></div>
    </div>
  </div>
</div>

<div class="leiste" id="leiste">
  <span class="stand" id="stand">—</span>
  <span class="kette" id="kette"></span>
  <button id="knopf-zurueck">◀ Türchen</button>
  <button id="knopf-weiter">Türchen ▶</button>
  <button id="knopf-neu">Neu</button>
  <span class="hinweis">Leertaste pausiert · B blendet die Leiste ganz aus</span>
</div>

<div class="start" id="start">
  <h1>S<i class="raute"></i>MSWELT<span class="news">&nbsp;NEWS</span></h1>
  <div class="linie"></div>
  <p>Sondersendung · Durchlauf</p>
  <button id="start-knopf">Sendung starten</button>
  <small>22 Minuten · am besten mit Ton und im Vollbild. Während der Sendung
         kommt unten eine Leiste zum Vor- und Zurückspringen — am Handy
         einmal aufs Bild tippen.</small>
</div>

<button class="tipp" id="tipp">
  <i></i>
  <span>Antippen</span>
  <small>Safari erlaubt den Ton erst nach einer Berührung.</small>
</button>

<script>
/* ===================================================================
   KONFIG — die Blöcke in Sendereihenfolge
   nummer   wie im Ablaufplan
   titel    Anzeige
   datei    die Seite, die abgespielt wird
   dauer    ungefähre Länge in Sekunden, nur für die Anzeige
   =================================================================== */
const BLOECKE = [
  { nummer: "1–4",  titel: "Ident, Begrüssung, Remy", datei: "news-remy.html",         dauer: 132 },
  { nummer: "5",    titel: "Tauchpost",               datei: "news-tauchpost.html",    dauer:  79 },
  { nummer: "6",    titel: "Gemeindehaus",            datei: "news-gemeindehaus.html", dauer: 111 },
  { nummer: "7",    titel: "Werbung ATLAS",           datei: "news-werbung.html",      dauer:  25, vorlauf: "kennung" },
  // Dieser Block bringt die Rueckkehrkennung selbst mit, deshalb kein Vorlauf
  { nummer: "8–9b", titel: "Boom Boom und Bite",      datei: "news-boom.html",         dauer: 102, vorlauf: "ohne" },
  { nummer: "10–11", titel: "Jahresbogen Jack und Vaas", datei: "news-jahresbogen.html", dauer: 165 },
  { nummer: "12",   titel: "Eriks Geburt",            datei: "news-erik.html",         dauer:  44 },
  { nummer: "13",   titel: "Eilmeldung",              datei: "news-eilmeldung.html",   dauer: 157 },
  { nummer: "14–15", titel: "Werbung Magazin",        datei: "news-werbung-magazin.html", dauer: 33, vorlauf: "kennung" },
  // Nach der zweiten Werbung kommt das grosse Logo aus der Uebersicht
  { nummer: "16",   titel: "Chip und das System",     datei: "news-chip.html",         dauer:  38, vorlauf: "rueckkehr" },
  { nummer: "17",   titel: "Camp Firefly",            datei: "news-camp.html",         dauer:  87 },
  { nummer: "18–19b", titel: "Dennah, Blaze und Jake", datei: "news-dennah-jake.html", dauer: 122 },
  // Konstanze kuendigt das Wetter an und nimmt es wieder entgegen —
  // dazwischen gehoert kein Logo, das ist dieselbe Moderation.
  { nummer: "20",   titel: "Wetter mit Artjom",       datei: "wetterkarte.html",       dauer:  84, vorlauf: "blende" },
  { nummer: "20b–24", titel: "Abschluss und Verabschiedung", datei: "news-abschluss.html", dauer: 129, vorlauf: "blende" }
];
/* ---------- Sprungmarken ----------
   Manche Bloecke tragen mehrere Tuerchen. Wo die Blockseite aus
   getrennten Teilen besteht, laesst sich jeder Teil einzeln
   anspringen; die Laengen sind an den Tondateien gemessen. Bei 1–4
   und 8–9b laeuft alles in einer durchgehenden Aufnahme — die bleiben
   je eine Marke, weil sich da nichts sauber trennen laesst. */
const MARKEN = [
  /* Der Remy-Block laeuft in einem Stueck. Die Begruessung geht bis
     Sekunde 27 des Studioclips, danach faengt Remy an — gesprungen
     wird hier also auf eine Sekunde, nicht auf einen Teil. */
  { nummer: "Start", titel: "Ident und Begrüssung", block: 0, zeit:  0, ab:  0, dauer:  27 },
  { nummer: "1–4",   titel: "Remy",                 block: 0, zeit: 27, ab: 27, dauer: 105 },
  { nummer: "5",     titel: "Tauchpost",                block:  1, dauer:  79 },
  { nummer: "6",     titel: "Gemeindehaus",             block:  2, dauer: 111 },
  { nummer: "7",     titel: "Werbung ATLAS",            block:  3, dauer:  25 },
  { nummer: "8–9b",  titel: "Boom Boom und Bite",       block:  4, dauer: 102 },
  { nummer: "10",    titel: "Jahresbogen Jack",         block:  5, teil: 0, dauer:  90 },
  { nummer: "11",    titel: "Jahresbogen Vaas",         block:  5, teil: 2, dauer:  82 },
  { nummer: "12",    titel: "Eriks Geburt",             block:  6, dauer:  44 },
  { nummer: "13",    titel: "Eilmeldung",               block:  7, dauer: 157 },
  { nummer: "14–15", titel: "Werbung Magazin",          block:  8, dauer:  33 },
  { nummer: "16",    titel: "Chip und das System",      block:  9, dauer:  38 },
  { nummer: "17",    titel: "Camp Firefly",             block: 10, dauer:  87 },
  { nummer: "18",    titel: "Dennah und Blaze",         block: 11, teil: 0, dauer:  57 },
  { nummer: "19",    titel: "Jake",                     block: 11, teil: 2, dauer:  59 },
  { nummer: "19b",   titel: "Anmoderation Wetter",      block: 11, teil: 4, dauer:  10 },
  { nummer: "20",    titel: "Wetter mit Artjom",        block: 12, dauer:  84 },
  { nummer: "20b",   titel: "Rückgabe ans Studio",      block: 13, teil: 0, dauer:   9 },
  { nummer: "21",    titel: "Kalender-Bilanz",          block: 13, teil: 1, dauer:  31 },
  { nummer: "23",    titel: "Verabschiedung",           block: 13, teil: 2, dauer:  76 },
  { nummer: "24",    titel: "Hinweis",                  block: 13, teil: 3, dauer:  12 }
];
/* Wo im Block die Marke anfaengt — ergibt sich aus den Marken davor. */
(function setzeAb() {
  let b = -1, ab = 0;
  MARKEN.forEach((m) => {
    if (m.block !== b) { b = m.block; ab = 0; }
    /* Eine Marke darf ihre Stelle im Block selbst setzen — bei Seiten
       aus einem Stueck ist das die Sekunde im Studioclip. */
    if (m.ab === undefined) m.ab = ab;
    ab = m.ab + m.dauer;
  });
})();
function markeVon(block, verstrichen) {
  let treffer = -1;
  MARKEN.forEach((m, k) => {
    if (m.block === block && verstrichen >= m.ab - 0.5) treffer = k;
  });
  return treffer;
}

/* =================================================================== */

const el = (id) => document.getElementById(id);
const feld   = el("feld");
const blende = el("blende");

/* ---------- Uebergaenge ----------
   Zwischen zwei Meldungen laeuft der Globuswischer. Vor einer Werbung und
   am Schluss der Sendung laeuft stattdessen die kurze Senderkennung —
   so wie im Fernsehen vor dem Werbeblock. Welcher Block welchen Vorlauf
   bekommt, steht in BLOECKE unter "vorlauf". */
const WISCHER  = "clips/globus-wisch.webm";
const WISCHTON = "clips/logo-wisch-ton.mp3";
const KENNUNG  = "clips/logo-kurz-weich.mp4";
const RUECKKEHR = "clips/simswelt-news-rueckkehr.mp4";   // grosses Logo nach der Werbung

const wischer   = el("wischer");     // stumm, Ton kommt aus der mp3
const kennvideo = el("kennvideo");   // bringt den Ton selbst mit
const rueckvideo = el("rueckvideo");
const wischton  = new Audio(WISCHTON);
wischton.preload = "auto";
wischer.src    = WISCHER;
kennvideo.src  = KENNUNG;
rueckvideo.src = RUECKKEHR;

/* Wie lange der Vorlauf steht, bevor der neue Block aufgedeckt wird.
   "ohne" ist fuer Bloecke, die ihre Kennung selbst mitbringen. */
/* Der Vorlauf steht etwas laenger, als er braucht: die ersten Bilder
   des neuen Blocks fallen damit noch hinter den Wischer, und das
   Anlaufen des Videos faellt nicht auf. */
/* Die Linie, nach der die Sendung schneidet:
     blende    — kein Logo, nur eine weiche Blende von Rahmen zu Rahmen.
                 Fuer Stellen, an denen Konstanze durchmoderiert: das
                 Wetter an- und abmoderieren, der Schluss der Sendung.
     kennung   — vor einer Werbung: die kurze Senderkennung.
     rueckkehr — nach einer Werbung: die grosse Kennung.
     ohne      — der Block bringt seine Kennung selbst mit.
     wisch     — der Themenwechsel zwischen zwei Bloecken. Das Globus-
                 video laeuft nicht mehr im Bild; geblieben ist sein
                 Ton ueber einer schwarzen Blende. Das Video wirkte an
                 zu vielen Stellen wie ein Fehler, der Ton allein
                 markiert den Schnitt sauber. */
const VORLAUF = { blende: 450, wisch: 1000, kennung: 1900, rueckkehr: 5400, ohne: 420 };

/* Luft vor und nach einem Vorlauf. Die kurze Senderkennung bringt ihre
   eigene Blende aus Schwarz und nach Schwarz mit — zusaetzliche Luft
   macht daraus eine Pause, die wie ein Aussetzer wirkt. Deshalb null.
   Die lange Rueckkehrkennung darf etwas Luft haben. */
const LUFT = { blende: 0, wisch: 0, kennung: 0, rueckkehr: 260, ohne: 0 };

/* Der Vorlauf laeuft, der Rahmenwechsel passiert dahinter. */
function spieleVorlauf(art) {
  if (art === "ohne" || art === "blende") return VORLAUF[art];
  // Der Themenwechsel ist jetzt Ton ueber Schwarz, ohne Globusvideo
  if (art === "wisch") {
    try { wischton.currentTime = 0; wischton.play().catch(function () {}); } catch (e) {}
    return VORLAUF.wisch;
  }
  const v = (art === "kennung") ? kennvideo : rueckvideo;
  const luft = LUFT[art] || 0;
  const los = function () {
    try {
      v.currentTime = 0;
      v.classList.add("an");
      const p = v.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  };
  if (luft) setTimeout(los, luft); else los();
  // Luft davor, der Vorlauf selbst, Luft danach
  return luft + (VORLAUF[art] || VORLAUF.wisch) + luft;
}
function vorlaufWeg() {
  wischer.classList.remove("an");
  kennvideo.classList.remove("an");
  rueckvideo.classList.remove("an");
}

let rahmen = [];          // zwei Rahmen im Wechsel
let vorn = 0;             // welcher gerade zu sehen ist
let index = -1;           // laufender Block
let uhr = null;
let warteUhr = null;      // wartet darauf, dass ein Block startbereit ist
let leisteAn = true;
let leisteUhr = null;

/* Die Leiste legt sich von selbst schlafen, sobald die Maus ruht —
   sonst steht sie vor dem Laufschriftbalken. Jede Mausbewegung holt
   sie zurueck, B schaltet sie ganz ab. */
function zeigeLeiste(an) {
  el("leiste").classList.toggle("zeig", an && leisteAn);
}
function leisteWecken() {
  if (!leisteAn) return;
  zeigeLeiste(true);
  clearTimeout(leisteUhr);
  /* Mit dem Finger braucht man laenger als mit der Maus. */
  const ruhe = (window.matchMedia &&
                matchMedia("(pointer: coarse)").matches) ? 4500 : 2600;
  leisteUhr = setTimeout(() => zeigeLeiste(false), ruhe);
}
document.addEventListener("mousemove", leisteWecken);
document.addEventListener("mousedown", leisteWecken);
document.addEventListener("touchstart", leisteWecken, { passive: true });

/* ---------- Tonsperre loesen ----------
   Auf dem Handy darf eine Seite Ton nur abspielen, wenn der Benutzer
   darin getippt hat, und die Sperre haengt am einzelnen Tonelement:
   was im Tippen selbst einmal play() bekommt, darf spaeter von alleine.
   Darum beruehrt der erste Tipp jedes Element, das die Sendung braucht
   — auch die im schon geladenen Rahmen. Lautstaerke auf null, damit
   das Loesen nicht zu hoeren ist; stumm schalten darf man nicht, eine
   stumme Wiedergabe loest die Sperre nicht. */
function loeseTonsperre() {
  const alle = [wischton, wischer, kennvideo, rueckvideo];
  alle.forEach((m) => {
    if (!m) return;
    if (!m.paused && m.currentTime > 0) return;        // laeuft schon
    let laut = 1;
    try {
      laut = m.volume;
      m.volume = 0;
      const p = m.play();
      const zurueck = function () {
        try { m.pause(); m.currentTime = 0; m.volume = laut; } catch (e) {}
      };
      if (p && p.then) p.then(zurueck, zurueck); else setTimeout(zurueck, 0);
    } catch (e) {
      try { m.volume = laut; } catch (e2) {}
    }
  });
}

function laenge(s) {
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return m + ":" + String(r).padStart(2, "0");
}

function baueKette() {
  const k = el("kette");
  k.innerHTML = "";
  MARKEN.forEach((m, n) => {
    const s = document.createElement("span");
    s.title = "Türchen " + m.nummer + " · " + m.titel;
    s.style.flex = m.dauer + " 1 0";      // breit wie lang
    s.innerHTML = "<i></i>";
    s.addEventListener("click", () => springe(n));
    k.appendChild(s);
  });
}

/* ---------- Fortschritt in der Kette ---------- */
let markeJetzt = -1;
function zeigeMarke(k) {
  Array.prototype.forEach.call(el("kette").children, (s, n) => {
    s.classList.toggle("jetzt", n === k);
    const b = s.querySelector("i");
    if (n < k) { s.classList.add("fertig"); if (b) b.style.width = "100%"; }
    if (n > k) { s.classList.remove("fertig"); if (b) b.style.width = "0"; }
  });
}
function zeigeFortschritt(block, verstrichen) {
  const k = markeVon(block, verstrichen);
  if (k < 0) return;
  const m = MARKEN[k];
  if (k !== markeJetzt) { markeJetzt = k; zeigeMarke(k); }
  const im = Math.max(0, verstrichen - m.ab);
  const s = el("kette").children[k];
  if (s) {
    const b = s.querySelector("i");
    if (b) b.style.width = Math.min(100, im / (m.dauer || 1) * 100) + "%";
  }
  el("stand").textContent = "Türchen " + m.nummer + " · " + m.titel +
    "  " + laenge(Math.min(im, m.dauer)) + " / " + laenge(m.dauer);
}

/* ---------- Rahmen verwalten ----------
   Jeder Block bekommt seinen eigenen Rahmen, und zwar schon beim
   Oeffnen der Uebersicht. Der Grund ist das Handy: Safari erlaubt Ton
   nur in Rahmen, die beim Tippen des Zuschauers bereits da waren. Ein
   Rahmen, der erst waehrend der Sendung entsteht, bleibt stumm —
   gemessen am iPhone, NotAllowedError, auch mit allow=autoplay.
   Damit dabei nicht vierzehn Bloecke gleichzeitig ihr Material ziehen,
   starten die Seiten im Ruhemodus (?ruhig=1) und holen ihre Dateien
   erst, wenn die Uebersicht ihnen sagt, dass sie dran sind. */
function baueRahmen() {
  BLOECKE.forEach((b, i) => {
    const f = document.createElement("iframe");
    f.setAttribute("allow", "autoplay; fullscreen");
    f.setAttribute("scrolling", "no");
    f.dataset.block = String(i);
    f.className = "schlaeft";
    f.addEventListener("load", () => {
      richteRahmenHer(f);
      sendeVorladen(f);
    }, { once: true });
    f.src = b.datei + "?ruhig=1";
    feld.insertBefore(f, blende);
    rahmen[i] = f;
  });
}

/* Dem Block sagen, dass er seine Dateien holen soll. Kommt die
   Aufforderung, bevor die Seite steht, wird sie beim Laden nachgereicht. */
function sendeVorladen(f) {
  if (!f || f.dataset.soll !== "1" || f.dataset.geholt === "1") return;
  try {
    const d = f.contentDocument;
    if (!d || d.readyState === "loading" || !f.contentWindow) return;
    f.contentWindow.postMessage({ swn: "vorladen" }, "*");
    f.dataset.geholt = "1";
    f.dataset.seit = String(Date.now());
  } catch (e) {}
}
function vorladen(i) {
  const f = rahmen[i];
  if (!f) return;
  f.dataset.soll = "1";
  sendeVorladen(f);
}

/* Einen Rahmen zum Schweigen bringen. Noetig, seit die Rahmen stehen
   bleiben statt neu geladen zu werden: ein Rahmen, den man nur
   unsichtbar macht, spielt seinen Ton munter weiter. Wer vorspult,
   hoerte sonst den alten Block unter dem neuen — und nach mehreren
   Spruengen alle uebereinander. */
function haltRahmen(f) {
  if (!f) return;
  try {
    const d = f.contentDocument;
    if (!d) return;
    Array.prototype.slice.call(d.querySelectorAll("video, audio")).forEach((m) => {
      try { m.pause(); } catch (e) {}
      try { if (m.currentTime > 0) m.currentTime = 0; } catch (e) {}
    });
    /* Ton anhalten reicht nicht: das Skript der Blockseite laeuft
       weiter und spielt von selbst den naechsten Teil an. Also sagen
       wir ihr, dass sie still sein soll, bis sie wieder dran ist. */
    if (f.contentWindow) f.contentWindow.postMessage({ swn: "halt" }, "*");
  } catch (e) {}
}

/* Nur der laufende und der naechste Rahmen bleiben in der Darstellung. */
let schlafUhr = null;
function zeigeRahmen(i) {
  rahmen.forEach((r, n) => {
    if (!r) return;
    if (n !== i) haltRahmen(r);
    if (n === i || n === i + 1) r.classList.remove("schlaeft");
    r.classList.toggle("vorn", n === i);
  });
  clearTimeout(schlafUhr);
  schlafUhr = setTimeout(() => {
    rahmen.forEach((r, n) => {
      if (r && n !== i && n !== i + 1) r.classList.add("schlaeft");
    });
  }, 900);
}

/* ---------- Jeden Block im Rahmen herrichten ----------
   Zwei Sachen: seine eigene Bedienleiste bleibt aus, sonst stehen zwei
   Leisten uebereinander und der Laufschriftbalken ist zu. Und seine
   Tastatur wird mitgehoert, weil der Rahmen den Fokus hat und ein
   Tastendruck sonst nie bei der Uebersicht ankommt. */
function richteRahmenHer(f) {
  try {
    const d = f.contentDocument;
    if (!d || !d.head || d.documentElement.dataset.swn === "1") return;
    d.documentElement.dataset.swn = "1";
    const st = d.createElement("style");
    st.textContent = "#leiste, #zeiten { display: none !important; }\n#start { opacity: 0 !important; pointer-events: none !important; }";
    d.head.appendChild(st);
    d.addEventListener("keydown", (e) => taste(e), true);
    d.addEventListener("mousemove", leisteWecken, true);
    d.addEventListener("mousedown", leisteWecken, true);
    /* Am Handy gibt es keine Maus. Ein Tipp im Bild holt die Leiste —
       der Tipp landet im Rahmen, darum muss der Rahmen ihn melden. */
    d.addEventListener("touchstart", leisteWecken, { capture: true, passive: true });
  } catch (e) {}
}

/* ---------- Das Medium in einem Rahmen finden ----------
   Nicht jedes Video in einer Seite ist Programm. Der Globuswischer
   zwischen zwei Themen ist eine Sekunde lang und liegt fertig
   geladen bereit, noch bevor der eigentliche Clip eine Quelle hat.
   Wer ihn mitzaehlt, haelt den Block nach einer Sekunde fuer fertig
   und ueberspringt ihn. Deshalb bleiben Wischer und Kennungen hier
   aussen vor.                                                      */
function istProgramm(m) {
  if (!m) return false;
  if (m.id === "wischer" || m.classList.contains("wischer")) return false;
  if (m.id === "kennung" || m.classList.contains("kennung")) return false;
  return true;
}

let zuletztAktiv = null;      // was zuletzt wirklich lief
function medium(f) {
  try {
    const d = f.contentDocument;
    if (!d) return null;
    const alle = Array.prototype.slice.call(d.querySelectorAll("video, audio"))
      .filter(istProgramm);
    // das längste Medium ist das eigentliche Programm, nicht die Kennung
    let best = null, spielend = null;
    alle.forEach(m => {
      if (!m.duration || !isFinite(m.duration)) return;
      if (!spielend && !m.paused && m.currentTime > 0) spielend = m;
      if (!best || m.duration > best.duration) best = m;
    });
    if (spielend) { zuletztAktiv = spielend; return spielend; }
    /* Steht gerade nichts, war es die Leertaste. Dann muss dasselbe
       Medium zurueckkommen, das eben noch lief — sonst greift die Uhr
       beim Studioteil die schon vorgeladene naechste Tonspur, und beim
       Weiterspielen kommt Ton, aber das Bild bleibt stehen. */
    if (zuletztAktiv && alle.indexOf(zuletztAktiv) >= 0 &&
        zuletztAktiv.currentTime > 0 && !zuletztAktiv.ended) return zuletztAktiv;
    return best;
  } catch (e) { return null; }
}

function starte(f, nr, zwingen) {
  try {
    const d = f.contentDocument;
    if (!d) return false;
    const k = d.getElementById("start-knopf");
    if (!k) return false;
    /* Erst starten, wenn das groesste Medium wirklich losspielen kann.
       Sonst faengt der Block an, bevor genug geladen ist, und die ersten
       Sekunden stocken. Die Warteschleife in spiele() gibt nach 16
       Sekunden ohnehin auf und startet dann trotzdem. */
    const m = Array.prototype.slice.call(d.querySelectorAll("video,audio"))
      .filter(istProgramm)
      .filter((x) => x.src && x.duration && isFinite(x.duration))
      .sort((a, b) => b.duration - a.duration)[0];
    /* Im Ruhemodus hat die Seite noch gar keine Quellen gesetzt. Dann
       ist "kein Medium" kein Freibrief zum Starten, sondern heisst:
       die Aufforderung ist gerade erst raus. Eine Sekunde Geduld. */
    if (!zwingen && !m && f.dataset.geholt === "1" &&
        Date.now() - (+f.dataset.seit || 0) < 1000) return false;
    if (m && !zwingen) {
      /* Manche Bloecke bringen ihre eigene kurze Kennung mit. Kennt der
         Hauptclip seine Laenge noch nicht, ist das laengste geladene
         Medium diese Kennung — und der Block waere nach fuenf Sekunden
         scheinbar zu Ende. Also erst anfangen, wenn das Geladene auch
         nach dem ganzen Block aussieht. Die Warteschleife in spiele()
         gibt nach sechzehn Sekunden ohnehin auf. */
      const soll = (BLOECKE[nr] && BLOECKE[nr].dauer) || 0;
      if (soll && m.duration < soll * 0.3) return false;
      if (m.readyState < 3) return false;
      const b = m.buffered;
      /* Bei einer kurzen Datei reicht, was es gibt — sonst wartet die
         Uebersicht auf drei Sekunden, die nie kommen. */
      const genug = Math.min(3.0, m.duration * 0.5);
      if (b.length === 0 || b.end(b.length - 1) < genug) return false;
    }
    k.click();
    return true;
  } catch (e) { return false; }
}

/* ---------- Mehrteilige Seiten melden sich selbst ----------
   Eine Seite mit mehreren Teilen (Studio, Bildstrecke, Studio) laesst
   sich am Medium nicht ablesen: zwischen den Teilen steht das Video am
   Ende, und die Uhr hielte den Block faelschlich fuer fertig und wuerde
   die Bildstrecke ueberspringen. Solche Seiten melden Beginn und Ende
   selbst, und solange sie das tun, zaehlt hier nur ihre Meldung.      */
let selbstmelder = false;
let ohneWischer  = false;       // beim Springen von Hand keinen Wischer
let ladeAnzeige  = null;        // Ladeanzeige erst nach dem Wischer
let blockBegonnen = 0;

window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || typeof d !== "object") return;
  if (d.swn === "selbstmelder") { selbstmelder = true; return; }
  /* Der Browser hat das Abspielen wirklich abgewiesen — nur dann
     kommt die Tippaufforderung. Frueher kam sie nach einer Wartezeit
     und damit auch beim Pausieren von Hand. */
  if (d.swn === "tonsperre") { letzteSperre = Date.now(); zeigeTipp(true); return; }
  if (d.swn === "ende") {
    clearInterval(uhr);
    spiele(index + 1);
  }
});

/* ---------- Abspielen ---------- */
function spiele(i) {
  if (i < 0) i = 0;
  if (i >= BLOECKE.length) { fertig(); return; }
  index = i;
  selbstmelder = false;

  clearInterval(uhr);
  /* Wer schnell mehrmals vorspult, hatte sonst mehrere Warteschleifen
     nebeneinander laufen — und eine alte startete spaeter noch ihren
     laengst verlassenen Block. */
  clearInterval(warteUhr);

  // Vor dem ersten Block kein Vorlauf — da kommt das Intro der Sendung.
  const mitVorlauf = (i > 0 && !ohneWischer);
  ohneWischer = false;
  const art  = BLOECKE[i].vorlauf || "wisch";
  /* Beim Globuswischer bleibt das Bild stehen und blendet darunter um.
     Die Senderkennung deckt ohnehin alles ab, da darf Schwarz drunter. */
  if (!mitVorlauf || art !== "blende") blende.classList.add("an");
  // Die Ladeanzeige soll nicht ueber dem Vorlauf stehen. Sie kommt erst,
  // wenn der Vorlauf durch ist und der Block immer noch nicht laeuft.
  clearTimeout(ladeAnzeige);
  let halten = 350;
  if (mitVorlauf) {
    halten = spieleVorlauf(art);
    // Ist der neue Block dann immer noch nicht da, erst jetzt zumachen
    ladeAnzeige = setTimeout(() => {
      blende.classList.add("an");
      zeigeLaden(i);
    }, halten + 450);
  } else {
    zeigeLaden(i);
  }

  // Jeder Block hat seinen festen Rahmen — nur noch zeigen und holen.
  const f = rahmen[i];
  if (!f) { fertig(); return; }
  vorn = i;
  vorladen(i);
  try {
    if (f.contentWindow) f.contentWindow.postMessage({ swn: "weiter" }, "*");
  } catch (e) {}
  zeigeRahmen(i);

  /* Reihenfolge: der Vorlauf laeuft ganz durch, blendet ab, und erst
     danach faengt der Block an. So beginnt nie eine Stimme, waehrend
     der Wischer noch im Bild steht, und der Wischer faengt nie an,
     solange noch gesprochen wird — das Ende des vorigen Blocks wird
     abgewartet, samt der Sekunde Luft am Schluss der Tonspur. */
  const ABBLENDE = 300;                 // deckt sich mit der CSS-Blende
  // Beim Wischer faengt der Block an, sobald das Video durch ist;
  // das Ausblenden liegt dann schon ueber dem laufenden Block.
  const losAb = Date.now() + halten +
                ((mitVorlauf && art !== "blende") ? ABBLENDE : 0);
  let abgeblendet = false;
  let versuche = 0;

  const warte = warteUhr = setInterval(() => {
    versuche++;
    const uebrig = losAb - Date.now();

    // Kurz vor Schluss den Vorlauf wegnehmen, damit er ausblenden kann
    /* Die Senderkennungen blenden selbst nach Schwarz, die nimmt man
       vorher weg. Der Globuswischer dagegen ist am Ende am hellsten —
       der laeuft ganz durch und blendet erst ueber dem schon laufenden
       Block aus. Sein Ton laeuft dabei einfach weiter. */
    if (!abgeblendet && art !== "blende" &&
        uebrig <= ABBLENDE + (LUFT[art] || 0)) {
      abgeblendet = true;
      vorlaufWeg();
    }
    if (uebrig > 0 && versuche <= 160) return;

    /* Nach zwoelf Sekunden wird der Block gestartet, auch wenn noch
       nicht genug geladen ist — lieber ein stockender Anfang als ein
       schwarzes Bild. Frueher ging die Schleife an dieser Stelle
       einfach weiter, ohne je den Startknopf zu druecken. */
    if (starte(f, i, versuche > 240) || versuche > 480) {
      clearInterval(warte);
      blende.classList.remove("an");
      vorlaufWeg();
      clearTimeout(ladeAnzeige);
      versteckeLaden();
      ueberwache(f, i);
      if (zielTeil > 0 && zielMarke >= 0 && MARKEN[zielMarke] &&
          MARKEN[zielMarke].block === i) {
        sageTeil(f, zielTeil);
        blockBegonnen = Date.now() - MARKEN[zielMarke].ab * 1000;
      }
      if (zielZeit > 0) sageZeit(f, zielZeit);
      zielTeil = -1; zielZeit = -1; zielMarke = -1;
      ladeVor(i + 1);
    }
  }, 50);
}

/* Den nächsten Block seine Dateien holen lassen */
/* ---------- Zu einer Marke springen ----------
   Laeuft der Block schon, wird nur der Teil gewechselt. Sonst wird
   der Block gestartet und der Teil nachgereicht, sobald er laeuft. */
let zielTeil = -1, zielZeit = -1, zielMarke = -1;
function sageZeit(f, sek) {
  try {
    if (!f || !f.contentWindow) return false;
    f.contentWindow.postMessage({ swn: "springe", zeit: sek }, "*");
    return true;
  } catch (e) { return false; }
}
function sageTeil(f, teil) {
  try {
    if (!f || !f.contentWindow) return false;
    f.contentWindow.postMessage({ swn: "springe", teil: teil }, "*");
    return true;
  } catch (e) { return false; }
}
function springe(k) {
  const m = MARKEN[k];
  if (!m) return;
  ohneWischer = true;
  if (m.block === index && typeof m.teil === "number" &&
      rahmen[m.block] && sageTeil(rahmen[m.block], m.teil)) {
    blockBegonnen = Date.now() - m.ab * 1000;
    markeJetzt = -1;
    return;
  }
  if (m.block === index && typeof m.zeit === "number" && rahmen[m.block] &&
      sageZeit(rahmen[m.block], m.zeit)) { markeJetzt = -1; return; }
  zielTeil  = (typeof m.teil === "number") ? m.teil : -1;
  zielZeit  = (typeof m.zeit === "number") ? m.zeit : -1;
  zielMarke = k;
  spiele(m.block);
}

function ladeVor(i) {
  if (i >= BLOECKE.length) return;
  vorladen(i);
}

/* Auf das Ende des Blocks warten */
let letztesMedium = null, letzteZeit = -1, steht = 0;

function ueberwache(f, i) {
  clearInterval(uhr);
  blockBegonnen = Date.now();
  letztesMedium = null; letzteZeit = -1; steht = 0;
  uhr = setInterval(() => {
    const m = medium(f);

    /* Laeuft es, ist die Tippaufforderung erledigt — aber nicht
       sofort: es kann der Ton laufen und das Bild abgewiesen worden
       sein. Nach einer Abweisung bleibt die Aufforderung vier Sekunden
       stehen, damit der Zuschauer sie ueberhaupt treffen kann. */
    if ((selbstmelder || (m && !m.paused && m.currentTime > 0.1)) &&
        Date.now() - letzteSperre > 4000) zeigeTipp(false);

    // Selbstmelder: Fortschritt an der Uhr, Ende kommt per Meldung
    if (selbstmelder) {
      zeigeFortschritt(i, (Date.now() - blockBegonnen) / 1000);
      return;
    }

    if (!m) { zeigeFortschritt(i, 0); return; }
    zeigeFortschritt(i, m.currentTime);
    /* Ende erreicht. Die Tonspuren haben am Schluss eine Sekunde Luft —
       die soll auch wirklich laufen, bevor der Wischer kommt.

       Auf die Uhr allein ist kein Verlass: eine mp4 meldet oft eine
       laengere Dauer, als sie Bilder hat. Der Remy-Block etwa haelt
       bei 132,0 s an, obwohl die Datei 132,8 s angibt — die Uebersicht
       wartete dann ewig auf eine Zehntelsekunde, die nie kommt, und
       der Block blieb haengen. Deshalb zaehlt zuerst, ob das Medium
       selbst fertig ist. */
    /* Manche Dateien feuern nicht einmal "ended" — sie bleiben einfach
       stehen. Deshalb zusaetzlich: steht die Zeit laenger als eine
       Sekunde still und ist das Ende in Sichtweite, ist der Block
       durch. */
    if (m !== letztesMedium) { letztesMedium = m; letzteZeit = -1; steht = 0; }
    if (Math.abs(m.currentTime - letzteZeit) < 0.01) steht += 200; else steht = 0;
    letzteZeit = m.currentTime;
    const haengt = steht >= 1000 && m.duration &&
                   m.currentTime >= m.duration - 2.0 && m.currentTime > 0;

    if (m.ended || haengt || (m.duration && m.currentTime >= m.duration - 0.05)) {
      clearInterval(uhr);
      spiele(i + 1);
    }
  }, 200);

  markeJetzt = -1;          // der naechste Takt setzt die Kette neu
}

function zeigeLaden(i) {
  el("laden-titel").textContent  = BLOECKE[i].titel;
  el("laden-nummer").textContent = "Block " + BLOECKE[i].nummer;
  el("laden").classList.add("an");
}
function versteckeLaden() { el("laden").classList.remove("an"); }

function fertig() {
  clearInterval(uhr);
  rahmen.forEach(haltRahmen);        // am Ende spielt nichts mehr nach
  // Zum Schluss die kurze Senderkennung, danach erst die Schlusstafel.
  kennvideo.currentTime = 0;
  kennvideo.classList.add("an");
  const tafel = () => {
    kennvideo.classList.remove("an");
    blende.classList.add("an");
    el("laden-titel").textContent  = "Ende der Sendung";
    el("laden-nummer").textContent = "SimsWelt News";
    el("laden").classList.add("an");
  };
  kennvideo.onended = tafel;
  setTimeout(tafel, 2600);               // falls das Video nicht startet
  const v = kennvideo.play();
  if (v && v.catch) v.catch(tafel);
}

/* ---------- Bedienung ---------- */
el("start-knopf").addEventListener("click", () => {
  loeseTonsperre();                 // muss im Tippen selbst passieren
  el("start").classList.add("weg");
  leisteWecken();
  baueKette();
  spiele(0);
});

/* ---------- Tippaufforderung ----------
   Wenn der Browser den Ton trotzdem sperrt, steht der Block bei 0 und
   nichts passiert. Dann kommt diese Flaeche: ein echter Tipp darauf
   loest die Sperre fuer den gerade geladenen Rahmen und startet ihn
   neu. Lieber ein Tipp als eine Sendung, die stumm steht. */
let letzteSperre = 0;
function zeigeTipp(an) {
  el("tipp").classList.toggle("an", !!an);
}
el("tipp").addEventListener("click", () => {
  zeigeTipp(false);
  const f = rahmen[vorn];
  if (!f) return;
  loeseTonsperre();
  /* Mitten im Block nur weiterspielen. Den Startknopf noch einmal zu
     druecken wuerde den Block von vorne anfangen lassen. */
  const m = medium(f);
  if (m && m.currentTime > 0) {
    try { const w = m.play(); if (w && w.catch) w.catch(function () {}); } catch (e) {}
    return;
  }
  try {
    const d = f.contentDocument;
    const k = d && d.getElementById("start-knopf");
    if (k) k.click();
  } catch (e) {}
});
function markeWeiter(richtung) {
  const k = (markeJetzt >= 0 ? markeJetzt : markeVon(index, 0)) + richtung;
  if (k >= MARKEN.length) { fertig(); return; }
  springe(Math.max(0, k));
}
el("knopf-weiter").addEventListener("click", () => markeWeiter(1));
el("knopf-zurueck").addEventListener("click", () => markeWeiter(-1));
el("knopf-neu").addEventListener("click", () => springe(markeJetzt >= 0 ? markeJetzt : 0));

function taste(e) {
  if (e.key === "b" || e.key === "B") {
    e.preventDefault(); leisteAn = !leisteAn;
    zeigeLeiste(leisteAn); return;
  }
  if (e.code === "Space") {
    e.preventDefault();
    const m = medium(rahmen[vorn]);
    if (m) m.paused ? m.play() : m.pause();
    return;
  }
  if (e.key === "ArrowRight" && e.shiftKey) { e.preventDefault(); markeWeiter(1); return; }
  if (e.key === "ArrowLeft"  && e.shiftKey) { e.preventDefault(); markeWeiter(-1); return; }
  // einfache Pfeile an den laufenden Block weiterreichen
  const m = medium(rahmen[vorn]);
  if (!m) return;
  const weite = 5;
  if (e.key === "ArrowRight") { e.preventDefault(); m.currentTime = Math.min(m.duration, m.currentTime + weite); }
  if (e.key === "ArrowLeft")  { e.preventDefault(); m.currentTime = Math.max(0, m.currentTime - weite); }
}
document.addEventListener("keydown", taste);

/* ---------- Alle Rahmen anlegen, den ersten vorladen ----------
   Die Rahmen muessen stehen, bevor der Zuschauer tippt — sonst
   verweigert Safari am Handy jedem spaeteren Rahmen den Ton. Material
   holt sich zunaechst nur der erste Block; die uebrigen warten im
   Ruhemodus, bis sie an der Reihe sind. */
baueRahmen();
vorladen(0);
</script>
