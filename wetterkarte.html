<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimsWelt News — Das Wetter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   SIMSWELT NEWS — Wetterkarte
   Eine Station = ein Ort. Sie bringt Kamerafahrt, Schild und Wetter
   gemeinsam mit, damit beim Verschieben nichts auseinanderläuft.
   =================================================================== */

:root {
  --nacht:       #040a14;
  --silber:      #c9d6e4;
  --weiss:       #ffffff;
  --messing:     #c9992f;
  --messing-hell:#e8c877;
  --kalt:        #8fc6f2;
  --warm:        #f0a93f;

  --art-rechts:   0.0%;
  --art-unten:    0.0%;
  --art-höhe:   84.0%;

  --binde-links:  4.5%;
  --binde-unten: 14.0%;

  --gegen: 1;

  --marke: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --eng:   "Barlow Condensed", "Arial Narrow", sans-serif;
  --text:  "Barlow", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #02060c; font-family: var(--text); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.bühne {
  position: relative; aspect-ratio: 16 / 9;
  width: min(100vw, calc(100vh * 16 / 9)); height: auto;
  background: #04121f; overflow: hidden; container-type: size;
}

.welt {
  position: absolute; inset: 0; transform-origin: 50% 50%;
  transform: scale(1.04);
  transition: transform 2.2s cubic-bezier(0.35, 0, 0.18, 1);
  will-change: transform;
}
.karte {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: saturate(0.82) brightness(0.68);
  transition: filter 2.5s ease;
}
.karte.klar { filter: saturate(1.05) brightness(0.95); }
#wetter { position: absolute; inset: 0; width: 100%; height: 100%; }

.schleier {
  position: absolute; inset: 0; z-index: 8; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(4,10,20,0.55) 0%, rgba(4,10,20,0) 24%),
    linear-gradient(0deg,  rgba(4,10,20,0.78) 0%, rgba(4,10,20,0) 32%),
    linear-gradient(270deg, rgba(4,10,20,0.62) 0%, rgba(4,10,20,0) 40%);
}

/* ---------- Ortsschilder ---------- */
.ort {
  position: absolute; z-index: 6;
  transform: translate(-50%, -50%) scale(calc(var(--gegen) * 0.86));
  opacity: 0; transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.2,0.9,0.3,1);
  text-align: center; pointer-events: none; white-space: nowrap;
}
.ort.an { opacity: 1; transform: translate(-50%, -50%) scale(var(--gegen)); }
.ort .punkt {
  width: 0.85cqw; height: 0.85cqw; margin: 0 auto 0.5cqw;
  background: var(--messing-hell); border-radius: 50%;
  box-shadow: 0 0 0 0.3cqw rgba(232,200,119,0.2), 0 0 1.2cqw rgba(232,200,119,0.5);
}
.ort .name { font-family: var(--eng); font-weight: 600; font-size: 1.5cqw; letter-spacing: 0.18em; text-transform: uppercase; color: var(--weiss); text-shadow: 0 2px 12px rgba(0,0,0,0.95); }
.ort .wert { font-family: var(--marke); font-weight: 800; font-size: 3.4cqw; line-height: 1.0; color: var(--weiss); text-shadow: 0 3px 16px rgba(0,0,0,0.95); }
.ort .zusatz { font-family: var(--eng); font-weight: 500; font-size: 1.3cqw; letter-spacing: 0.1em; color: var(--silber); text-shadow: 0 2px 10px rgba(0,0,0,0.95); }
.ort.kalt .wert { color: var(--kalt); }
.ort.warm .wert { color: var(--warm); }

/* ---------- Lagetafel ---------- */
.lage {
  position: absolute; left: 3.4%; top: 6.5%; z-index: 14;
  background: rgba(6,16,30,0.9); border-left: 4px solid var(--messing);
  padding: 0.9cqw 1.6cqw 1.0cqw;
  opacity: 0; transform: translateX(-16px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.lage.an { opacity: 1; transform: translateX(0); }
.lage b { display: block; font-family: var(--marke); font-weight: 800; font-size: 2.3cqw; line-height: 1.05; color: var(--weiss); }
.lage span { display: block; margin-top: 0.3em; font-family: var(--eng); font-weight: 600; font-size: 1.25cqw; letter-spacing: 0.2em; text-transform: uppercase; color: var(--messing-hell); }

/* ---------- Artjom ---------- */
#artjom {
  position: absolute; right: var(--art-rechts); bottom: var(--art-unten);
  height: var(--art-höhe); width: auto; z-index: 20;
  filter: drop-shadow(-16px 0 30px rgba(0,0,0,0.6));
}
#quelle { display: none; }

/* ---------- Kennung und Bauchbinde ---------- */
.raute { display: inline-block; position: relative; width: .30em; height: .62em; margin: 0 .085em; }
.raute::before { content: ""; position: absolute; inset: 0;   background: var(--messing); clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
.raute::after  { content: ""; position: absolute; inset: 22%; background: var(--nacht);   clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
.kennung {
  position: absolute; top: 4.2%; right: 3.2%; z-index: 22;
  display: flex; align-items: baseline; gap: 0.7em;
  font-family: var(--marke); font-weight: 800;
  font-size: clamp(11px, 1.5vw, 25px); letter-spacing: -0.012em;
  color: var(--weiss); text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  opacity: 0; transition: opacity 0.6s ease;
}
.kennung.sichtbar { opacity: 1; }
.kennung .news { color: var(--messing-hell); }

.binde {
  position: absolute; left: var(--binde-links); bottom: var(--binde-unten);
  z-index: 24; display: flex; align-items: stretch;
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.binde.sichtbar { opacity: 1; transform: translateY(0); }
.binde .flagge { background: var(--messing); color: #0a1220; font-family: var(--eng); font-weight: 700; font-size: clamp(9px, 1.05vw, 18px); letter-spacing: 0.18em; display: flex; align-items: center; padding: 0 0.9em; }
.binde .inhalt { background: rgba(6,16,30,0.94); border-left: 1px solid rgba(201,214,228,0.22); padding: 0.55em 2em 0.6em 1.05em; }
.binde .name { font-family: var(--marke); font-weight: 800; font-size: clamp(12px, 1.65vw, 28px); line-height: 1.06; color: var(--weiss); }
.binde .rolle { font-family: var(--eng); font-weight: 600; font-size: clamp(9px, 1vw, 17px); letter-spacing: 0.22em; text-transform: uppercase; color: var(--messing-hell); }

/* ---------- Bedienung ---------- */
.leiste {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 88;
  display: none; align-items: center; gap: 0.9em; padding: 0.5em 1em 0.6em;
  background: linear-gradient(0deg, rgba(4,10,20,0.95), rgba(4,10,20,0.6));
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--messing-hell);
}
.leiste.zeig { display: flex; }
.leiste .zeit { flex: 0 0 auto; min-width: 8.5em; }
.leiste .spur { position: relative; flex: 1 1 auto; height: 16px; background: rgba(201,214,228,0.14); cursor: pointer; }
.leiste .füll { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--messing); }
.leiste .marker { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.55); }
.leiste button { flex: 0 0 auto; font-family: inherit; font-size: 11px; letter-spacing: 0.06em; color: var(--nacht); background: var(--messing-hell); border: none; padding: 0.45em 0.9em; cursor: pointer; }
.leiste button:hover { background: var(--weiss); }
.leiste .hinweis { flex: 0 0 auto; color: var(--silber); font-size: 11px; }

.zeiten {
  position: absolute; right: 1.5%; top: 2%; bottom: 12%; width: 32%; min-width: 340px;
  z-index: 92; display: none; flex-direction: column;
  background: rgba(4,10,20,0.96); border: 1px solid var(--messing);
  font-family: var(--text); font-size: 12px; color: var(--weiss);
}
.zeiten.zeig { display: flex; }
.zeiten h3 { margin: 0; padding: 0.7em 0.9em; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--nacht); background: var(--messing-hell); }
.zeiten .liste { flex: 1 1 auto; overflow-y: auto; padding: 0.4em 0.6em; }
.zeiten .zeile { display: grid; grid-template-columns: 1fr auto auto; gap: 0.35em; align-items: center; padding: 0.4em 0.3em; border-bottom: 1px solid rgba(201,214,228,0.14); }
.zeiten .zeile.jetzt { background: rgba(201,153,47,0.22); }
.zeiten .titel small { display: block; color: var(--silber); font-size: 10px; }
.zeiten button { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; border: 1px solid rgba(232,200,119,0.5); background: transparent; color: var(--messing-hell); padding: 0.28em 0.5em; cursor: pointer; }
.zeiten button:hover { background: var(--messing); color: var(--nacht); }
.zeiten .fuss { padding: 0.55em 0.7em; border-top: 1px solid rgba(201,214,228,0.2); }
.zeiten textarea { display: none; width: 100%; height: 180px; margin-top: 0.5em; background: #071322; color: var(--messing-hell); border: 1px solid rgba(232,200,119,0.4); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; padding: 0.4em; }
.zeiten.ausgabe textarea { display: block; }

body.justiert .ort { opacity: 1 !important; outline: 1px dashed rgba(232,200,119,0.6); cursor: move; pointer-events: auto; }
body.justiert #artjom { outline: 2px solid #35d6a0; cursor: move; }
body.justiert .welt { transform: scale(1.04) !important; }
.justier {
  position: absolute; left: 1.5%; top: 2%; z-index: 95; display: none;
  background: rgba(4,10,20,0.96); border: 1px solid var(--messing);
  padding: 0.75em 1.15em; font-family: var(--text); font-size: 13px; line-height: 1.6;
  color: var(--weiss); white-space: pre; pointer-events: none;
}
.justier.zeig { display: block; }
.justier b { color: var(--messing-hell); font-weight: 600; }
.justier code { display: none; margin-top: 0.55em; padding: 0.45em 0.65em; background: #071322; color: var(--messing-hell); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; user-select: all; }
.justier.werte-zeigen code { display: block; pointer-events: auto; }

.start {
  position: absolute; inset: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
  background: radial-gradient(ellipse at 50% 44%, #16314f 0%, #0a1c33 44%, #040a14 100%);
  cursor: pointer; transition: opacity 0.4s ease, visibility 0.4s ease;
}
.start.weg { opacity: 0; visibility: hidden; }
.start h1 { margin: 0; font-family: var(--marke); font-weight: 800; font-size: clamp(26px, 5vw, 84px); letter-spacing: -0.012em; color: var(--weiss); display: flex; align-items: baseline; }
.start h1 .news { color: var(--messing-hell); }
.start .linie { width: 42%; height: 2px; background: var(--messing); }
.start p { margin: 0; font-family: var(--eng); font-weight: 600; font-size: clamp(11px,1.3vw,21px); letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase; color: rgba(201,214,228,0.82); }
.start button { margin-top: 0.3rem; font-family: var(--eng); font-weight: 700; font-size: clamp(13px,1.4vw,22px); letter-spacing: 0.16em; text-transform: uppercase; color: var(--nacht); background: var(--messing); border: none; padding: 0.8em 2.6em; cursor: pointer; }
.start button:hover { background: var(--messing-hell); }
.start label { font-family: var(--eng); font-weight: 600; font-size: clamp(11px,1.15vw,18px); letter-spacing: 0.1em; text-transform: uppercase; color: var(--messing-hell); border-bottom: 1px solid rgba(232,200,119,0.5); cursor: pointer; }
.start label input { display: none; }
.start small { font-family: var(--text); font-size: clamp(10px,0.95vw,14px); color: rgba(201,214,228,0.5); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="hellzualpha"><feColorMatrix type="luminanceToAlpha"/></filter>
</svg>

<div class="bühne" id="bühne">

  <div class="welt" id="welt">
    <div class="karte" id="karte"></div>
    <canvas id="wetter"></canvas>
    <div id="orte"></div>
  </div>

  <div class="schleier"></div>
  <div class="lage" id="lage"><b></b><span></span></div>

  <canvas id="artjom"></canvas>
  <video id="quelle" playsinline preload="auto"></video>

  <div class="kennung" id="kennung">
    <span>S<i class="raute"></i>MSWELT<span class="news">&nbsp;NEWS</span></span>
  </div>

  <div class="binde" id="binde">
    <div class="flagge">WETTER</div>
    <div class="inhalt">
      <div class="name" id="binde-name"></div>
      <div class="rolle" id="binde-rolle"></div>
    </div>
  </div>

  <div class="leiste" id="leiste">
    <span class="zeit" id="leiste-zeit">0.0 / 0.0</span>
    <span class="spur" id="leiste-spur"><span class="füll" id="leiste-füll"></span></span>
    <button id="knopf-video">Video wählen…</button>
    <span class="hinweis">Z Zeiten · J ausrichten · T ausblenden</span>
  </div>

  <div class="zeiten" id="zeiten">
    <h3>Stationen · Z schliesst</h3>
    <div class="liste" id="zeiten-liste"></div>
    <div class="fuss">
      <button id="zeiten-ausgabe">Werte zum Kopieren</button>
      <textarea id="zeiten-text" readonly></textarea>
    </div>
  </div>

  <div class="justier" id="justier"></div>

  <div class="start" id="start">
    <h1>S<i class="raute"></i>MSWELT<span class="news">&nbsp;NEWS</span></h1>
    <div class="linie"></div>
    <p>Das Wetter</p>
    <button id="start-knopf">Abspielen</button>
    <label>Video von Hand wählen<input type="file" id="datei" accept="video/*"></label>
    <small>Leertaste pausiert · Pfeile springen · Z setzt Zeiten · J richtet aus · T blendet aus · R startet neu</small>
  </div>

</div>

<script>
/* ===================================================================
   KONFIG

   Eine Station bringt alles mit, was zu einem Ort gehört:
     ab      ab dieser Sekunde läuft die Station
     name    Beschriftung. Leer lassen = kein Schild
     x, y    Ort auf der Karte, in Prozent
     zoom    1.04 = Übersicht, 2.6 = nah dran
     wert    grosse Zahl im Schild
     zusatz  kleine Zeile darunter
     art     kalt | warm | neutral  (färbt die Zahl)
     wetter  nebel | schnee | sturm | sonne | dürre | nacht | klar | ""
     weite   Wirkungsradius des Wetters in Prozent der Bildbreite

   Die Station gilt bis zur nächsten. Mit Z setzt du ihre Zeit beim
   Hören — Fahrt, Schild und Wetter wandern dabei gemeinsam.
   =================================================================== */
const KONFIG = {

  fassung: "v9 · deine Zeiten",

  video: "clips/artjom-wetter-maske.mp4",
  karte: "bilder/atlas-kontinent.png",

  binde: { name: "Artjom Komarow", rolle: "Praktikant", ein: 1.5, aus: 9.0 },

  versatz: 9,          // schiebt das Ziel nach links, weil Artjom rechts steht

  stationen: [
    { ab:  0.0, name: "",                  x: 50.0, y: 46.0, zoom: 1.04,
      wert: "",        zusatz: "",                  art: "neutral", wetter: "",       weite: 60 },
    { ab:  6.5, name: "",                  x: 48.0, y: 42.0, zoom: 1.20,
      wert: "",        zusatz: "",                  art: "neutral", wetter: "nebel",  weite: 70 },
    { ab: 23.7, name: "Granite Falls",     x: 39.0, y: 13.0, zoom: 2.60,
      wert: "−4°",     zusatz: "15 cm Neuschnee",   art: "kalt",    wetter: "schnee", weite: 55 },
    { ab: 30.0, name: "Windenburg",        x: 62.0, y: 45.0, zoom: 2.10,
      wert: "80 km/h", zusatz: "Böen an der Küste", art: "neutral", wetter: "sturm",  weite: 55 },
    { ab: 37.7, name: "",                  x: 58.0, y: 44.0, zoom: 1.45,
      wert: "",        zusatz: "",                  art: "neutral", wetter: "sturm",  weite: 70 },
    { ab: 49.6, name: "Sulani",            x: 66.0, y: 88.0, zoom: 2.30,
      wert: "26°",     zusatz: "",                  art: "warm",    wetter: "sonne",  weite: 45 },
    { ab: 52.6, name: "Oasis Springs",     x: 36.5, y: 58.0, zoom: 2.30,
      wert: "11°",     zusatz: "trocken",           art: "warm",    wetter: "dürre",  weite: 50 },
    { ab: 55.4, name: "Forgotten Hollow",  x: 28.5, y: 20.0, zoom: 2.60,
      wert: "Nacht",   zusatz: "keine Vorhersage",  art: "neutral", wetter: "nacht",  weite: 55 },
    { ab: 61.6, name: "",                  x: 50.0, y: 46.0, zoom: 1.08,
      wert: "",        zusatz: "",                  art: "neutral", wetter: "klar",   weite: 90 }
  ],

  /* Tafeln oben links. Jede gilt ab ihrer Sekunde bis zur nächsten.
     Leerer Titel blendet die Tafel aus.                                */
  lage: [
    { ab:  0.1, titel: "",           zusatz: "" },
    { ab:  7.2, titel: "997 hPa",    zusatz: "über Brightchester · fallend" },
    { ab: 19.6, titel: "Hochnebel",  zusatz: "über dem halben Kontinent" },
    { ab: 25.1, titel: "",           zusatz: "" },
    { ab: 61.4, titel: "Aufklarend", zusatz: "ab 22 Uhr klare Sicht" },
    { ab: 70.8, titel: "",           zusatz: "" }
  ]
};

/* =================================================================== */

const el = (id) => document.getElementById(id);
const quelle = el("quelle");
const artjom = el("artjom");
const aCtx   = artjom.getContext("2d");
const leinw  = el("wetter");
const wCtx   = leinw.getContext("2d");
const karte  = el("karte");
const welt   = el("welt");

let leisteAn = true, zeitenAn = false, justierAn = false;

karte.style.backgroundImage = 'url("' + KONFIG.karte + '")';
quelle.src = KONFIG.video;
el("binde-name").textContent  = KONFIG.binde.name;
el("binde-rolle").textContent = KONFIG.binde.rolle;

/* ---------- Schilder ---------- */
const schilder = KONFIG.stationen.map((s, i) => {
  if (!s.name) return null;
  const d = document.createElement("div");
  d.className = "ort " + (s.art || "neutral");
  d.dataset.i = String(i);
  d.style.left = s.x + "%";
  d.style.top  = s.y + "%";
  d.innerHTML = '<div class="punkt"></div><div class="name"></div><div class="wert"></div><div class="zusatz"></div>';
  d.querySelector(".name").textContent   = s.name;
  d.querySelector(".wert").textContent   = s.wert;
  d.querySelector(".zusatz").textContent = s.zusatz || "";
  el("orte").appendChild(d);
  return d;
});

/* ---------- Kamerafahrt, begrenzt auf den Kartenrand ---------- */
function fahreZu(s) {
  const z = s.zoom;
  const grenze = (z - 1) * 50 / z;
  const kappe = (v) => Math.max(-grenze, Math.min(grenze, v));
  const zx = s.x + (KONFIG.versatz || 0) * (z - 1) / z;
  welt.style.transform = "scale(" + z + ") translate(" +
    kappe(50 - zx).toFixed(2) + "%, " + kappe(50 - s.y).toFixed(2) + "%)";
  document.documentElement.style.setProperty("--gegen", (1 / z).toFixed(3));
}

/* ===================================================================
   Artjom freistellen
   =================================================================== */
let breite = 0, höhe = 0, mitFilter = true;
const hilf = document.createElement("canvas");
const hCtx = hilf.getContext("2d");

quelle.addEventListener("loadedmetadata", () => {
  breite = quelle.videoWidth;
  höhe  = quelle.videoHeight / 2;
  artjom.width = breite; artjom.height = höhe;
  hilf.width = breite;   hilf.height = höhe;
  hCtx.filter = "url(#hellzualpha)";
  mitFilter = (hCtx.filter !== "none");
  hCtx.filter = "none";
  baueMarker();
});

function zeichneArtjom() {
  if (!breite || quelle.readyState < 2) return;
  aCtx.clearRect(0, 0, breite, höhe);
  aCtx.globalCompositeOperation = "source-over";
  aCtx.drawImage(quelle, 0, 0, breite, höhe, 0, 0, breite, höhe);
  hCtx.clearRect(0, 0, breite, höhe);
  if (mitFilter) {
    hCtx.filter = "url(#hellzualpha)";
    hCtx.drawImage(quelle, 0, höhe, breite, höhe, 0, 0, breite, höhe);
    hCtx.filter = "none";
  } else {
    hCtx.drawImage(quelle, 0, höhe, breite, höhe, 0, 0, breite, höhe);
    const d = hCtx.getImageData(0, 0, breite, höhe), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      p[i + 3] = (p[i] * 0.2126 + p[i + 1] * 0.7152 + p[i + 2] * 0.0722) | 0;
      p[i] = p[i + 1] = p[i + 2] = 0;
    }
    hCtx.putImageData(d, 0, 0);
  }
  aCtx.globalCompositeOperation = "destination-in";
  aCtx.drawImage(hilf, 0, 0);
  aCtx.globalCompositeOperation = "source-over";
}

/* ===================================================================
   Wetter
   =================================================================== */
function passeLeinwandAn() {
  const r = document.querySelector(".bühne").getBoundingClientRect();
  const b = Math.round(r.width), h = Math.round(r.height);
  if (b && h && (Math.abs(leinw.width - b) > 3 || Math.abs(leinw.height - h) > 3)) {
    leinw.width = b; leinw.height = h;
  }
}
setInterval(passeLeinwandAn, 500);

const flocken = Array.from({ length: 320 }, () => {
  const tiefe = 0.35 + Math.random() * 0.65;
  return { x: Math.random(), y: Math.random(), t: tiefe,
           r: 0.7 + tiefe * 2.6, v: 0.025 + tiefe * 0.075,
           s: Math.random() * 6, w: 0.006 + Math.random() * 0.016 };
});
const böen = Array.from({ length: 110 }, () => ({
  x: Math.random(), y: Math.random(), l: 0.02 + Math.random() * 0.10,
  v: 0.18 + Math.random() * 0.42, d: 0.25 + Math.random() * 0.6, b: Math.random() * 6
}));
const sterne = Array.from({ length: 140 }, () => ({
  x: Math.random(), y: Math.random() * 0.7, r: 0.4 + Math.random() * 1.4, p: Math.random() * 6
}));
const schlieren = Array.from({ length: 30 }, () => ({
  x: Math.random(), y: Math.random(), l: 0.02 + Math.random() * 0.05,
  p: Math.random() * 6, v: 0.5 + Math.random()
}));

const ARTEN = ["nebel", "schnee", "sturm", "sonne", "dürre", "nacht", "klar"];
let stärke = {}; ARTEN.forEach(a => stärke[a] = 0);
let zuletzt = performance.now();
let station = null;        // gerade laufende Station

function zeichneWetter(jetzt) {
  const dt = Math.min(0.05, (jetzt - zuletzt) / 1000);
  zuletzt = jetzt;
  const t = jetzt / 1000;
  const B = leinw.width, H = leinw.height;
  if (!B) { requestAnimationFrame(zeichneWetter); return; }
  wCtx.clearRect(0, 0, B, H);

  ARTEN.forEach(a => {
    const ziel = (station && station.wetter === a) ? 1 : 0;
    stärke[a] += (ziel - stärke[a]) * Math.min(1, dt * 1.5);
  });

  // Mittelpunkt des laufenden Wetters
  const s = station || KONFIG.stationen[0];
  const m = { x: s.x / 100 * B, y: s.y / 100 * H, r: (s.weite || 55) / 100 * B };
  const abfall = (px, py) => Math.max(0, 1 - Math.hypot(px - m.x, py - m.y) / m.r);

  /* --- Hochnebel --- */
  if (stärke.nebel > 0.01) {
    for (let i = 0; i < 6; i++) {
      const tempo = 26 + i * 14;
      const x = ((t * tempo + i * 520) % (B + 1100)) - 550;
      const y = m.y + (i - 2.5) * H * 0.115 + Math.sin(t * 0.5 + i * 1.7) * H * 0.055;
      const rx = B * (0.26 + i * 0.035), ry = H * 0.17;
      const a = 0.26 * stärke.nebel * (0.55 + 0.45 * Math.sin(t * 0.55 + i * 2.1));
      wCtx.save();
      wCtx.translate(x, y); wCtx.scale(1, ry / rx);
      const g = wCtx.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0,    "rgba(214,228,244," + a.toFixed(3) + ")");
      g.addColorStop(0.55, "rgba(214,228,244," + (a * 0.5).toFixed(3) + ")");
      g.addColorStop(1,    "rgba(214,228,244,0)");
      wCtx.fillStyle = g; wCtx.beginPath(); wCtx.arc(0, 0, rx, 0, 7); wCtx.fill();
      wCtx.restore();
    }
    wCtx.lineCap = "round";
    for (let i = 0; i < 22; i++) {
      const tempo = 60 + (i % 5) * 34;
      const x = ((t * tempo + i * 310) % (B + 700)) - 350;
      const y = m.y + Math.sin(i * 2.3) * H * 0.26 + Math.sin(t * 0.8 + i) * H * 0.012;
      const l = B * (0.05 + (i % 4) * 0.035);
      wCtx.globalAlpha = 0.20 * stärke.nebel * (0.4 + 0.6 * Math.sin(t * 0.7 + i));
      wCtx.strokeStyle = "#e4eef9"; wCtx.lineWidth = 2 + (i % 3);
      wCtx.beginPath(); wCtx.moveTo(x, y);
      wCtx.quadraticCurveTo(x + l * 0.5, y - H * 0.016, x + l, y); wCtx.stroke();
    }
    wCtx.globalAlpha = 1;
  }

  /* --- Schnee --- */
  if (stärke.schnee > 0.01) {
    const wind = Math.sin(t * 0.33) * 0.5 + 0.5;
    flocken.forEach(f => {
      f.y += f.v * dt;
      f.x += (Math.sin(t * 0.8 + f.s) * f.w + wind * 0.012 * f.t) * dt;
      if (f.y > 1.02) { f.y = -0.03; f.x = Math.random(); }
      if (f.x > 1.05) f.x = -0.03;
      const px = f.x * B, py = f.y * H, k = abfall(px, py);
      if (k <= 0) return;
      wCtx.globalAlpha = k * stärke.schnee * (0.35 + f.t * 0.6);
      wCtx.fillStyle = "#ffffff";
      wCtx.beginPath(); wCtx.arc(px, py, f.r, 0, 7); wCtx.fill();
    });
    const g = wCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0, "rgba(226,240,255," + (0.14 * stärke.schnee).toFixed(3) + ")");
    g.addColorStop(1, "rgba(226,240,255,0)");
    wCtx.globalAlpha = 1; wCtx.fillStyle = g; wCtx.fillRect(0, 0, B, H);
  }

  /* --- Sturm --- */
  if (stärke.sturm > 0.01) {
    const welle = 0.55 + 0.45 * Math.sin(t * 0.9);
    wCtx.lineCap = "round";
    böen.forEach(b => {
      b.x += b.v * dt * (0.5 + welle);
      if (b.x > 1.12) { b.x = -0.2; b.y = Math.random(); }
      const px = b.x * B, py = b.y * H + Math.sin(t * 2 + b.b) * H * 0.012;
      const k = abfall(px, py);
      if (k <= 0) return;
      wCtx.globalAlpha = k * stärke.sturm * 0.55 * b.d * welle;
      wCtx.strokeStyle = "#e4effb"; wCtx.lineWidth = 1.2 + b.d * 1.4;
      wCtx.beginPath(); wCtx.moveTo(px, py);
      wCtx.quadraticCurveTo(px + b.l * B * 0.5, py - H * 0.012, px + b.l * B, py);
      wCtx.stroke();
    });
    wCtx.globalAlpha = 1;
  }

  /* --- Sonne --- */
  if (stärke.sonne > 0.01) {
    const g = wCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0,   "rgba(255,206,120," + (0.34 * stärke.sonne).toFixed(3) + ")");
    g.addColorStop(0.5, "rgba(255,186,90,"  + (0.12 * stärke.sonne).toFixed(3) + ")");
    g.addColorStop(1,   "rgba(255,186,90,0)");
    wCtx.fillStyle = g; wCtx.fillRect(0, 0, B, H);
    wCtx.save(); wCtx.translate(m.x, m.y); wCtx.rotate(t * 0.09);
    for (let i = 0; i < 12; i++) {
      wCtx.rotate(Math.PI / 6);
      wCtx.globalAlpha = stärke.sonne * 0.08 * (0.6 + 0.4 * Math.sin(t * 1.2 + i));
      wCtx.fillStyle = "#ffe0a0";
      wCtx.beginPath(); wCtx.moveTo(0, 0);
      wCtx.lineTo(m.r * 0.95, -m.r * 0.05); wCtx.lineTo(m.r * 0.95, m.r * 0.05);
      wCtx.closePath(); wCtx.fill();
    }
    wCtx.restore(); wCtx.globalAlpha = 1;
  }

  /* --- Dürre --- */
  if (stärke.dürre > 0.01) {
    schlieren.forEach(s2 => {
      const px = (s2.x + Math.sin(t * s2.v + s2.p) * 0.012) * B;
      const py = (s2.y + Math.sin(t * 0.6 + s2.p) * 0.008) * H;
      const k = abfall(px, py);
      if (k <= 0) return;
      wCtx.globalAlpha = k * stärke.dürre * 0.26;
      wCtx.strokeStyle = "#ffe9c4"; wCtx.lineWidth = 1.2;
      wCtx.beginPath(); wCtx.moveTo(px, py);
      wCtx.quadraticCurveTo(px + s2.l * B * 0.5, py - H * 0.009, px + s2.l * B, py);
      wCtx.stroke();
    });
    const g = wCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0, "rgba(255,196,110," + (0.18 * stärke.dürre).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,196,110,0)");
    wCtx.globalAlpha = 1; wCtx.fillStyle = g; wCtx.fillRect(0, 0, B, H);
  }

  /* --- Nacht --- */
  if (stärke.nacht > 0.01) {
    const g = wCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0, "rgba(2,6,16," + (0.74 * stärke.nacht).toFixed(3) + ")");
    g.addColorStop(1, "rgba(2,6,16,0)");
    wCtx.fillStyle = g; wCtx.fillRect(0, 0, B, H);
    const mx = m.x + m.r * 0.42, my = m.y - m.r * 0.40, mr = B * 0.018;
    const gm = wCtx.createRadialGradient(mx, my, 0, mx, my, mr * 6);
    gm.addColorStop(0, "rgba(226,236,255," + (0.5 * stärke.nacht).toFixed(3) + ")");
    gm.addColorStop(1, "rgba(226,236,255,0)");
    wCtx.fillStyle = gm; wCtx.fillRect(0, 0, B, H);
    wCtx.globalAlpha = stärke.nacht;
    wCtx.fillStyle = "#eef3ff";
    wCtx.beginPath(); wCtx.arc(mx, my, mr, 0, 7); wCtx.fill();
    // ein paar funkelnde Punkte im dunklen Gebiet
    sterne.slice(0, 40).forEach(st => {
      const px = m.x + (st.x - 0.5) * m.r * 1.6, py = m.y + (st.y - 0.35) * m.r * 1.2;
      wCtx.globalAlpha = stärke.nacht * (0.2 + 0.5 * Math.abs(Math.sin(t * 1.4 + st.p)));
      wCtx.beginPath(); wCtx.arc(px, py, st.r * 0.8, 0, 7); wCtx.fill();
    });
    wCtx.globalAlpha = 1;
  }

  /* --- Aufklaren --- */
  if (stärke.klar > 0.01) {
    sterne.forEach(st => {
      wCtx.globalAlpha = stärke.klar * (0.25 + 0.55 * Math.abs(Math.sin(t * 1.1 + st.p)));
      wCtx.fillStyle = "#eef4ff";
      wCtx.beginPath(); wCtx.arc(st.x * B, st.y * H, st.r, 0, 7); wCtx.fill();
    });
    wCtx.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {
      const y = H * (0.10 + i * 0.05) + Math.sin(t * 0.25 + i) * H * 0.02;
      const g = wCtx.createLinearGradient(0, y - H * 0.08, 0, y + H * 0.08);
      const a = 0.10 * stärke.klar * (0.5 + 0.5 * Math.sin(t * 0.4 + i * 2));
      g.addColorStop(0,   "rgba(120,230,190,0)");
      g.addColorStop(0.5, "rgba(120,230,190," + a.toFixed(3) + ")");
      g.addColorStop(1,   "rgba(120,230,190,0)");
      wCtx.fillStyle = g; wCtx.fillRect(0, y - H * 0.08, B, H * 0.16);
    }
  }
  karte.classList.toggle("klar", stärke.klar > 0.4);

  zeichneArtjom();
  requestAnimationFrame(zeichneWetter);
}
requestAnimationFrame(zeichneWetter);

/* ---------- Takt ---------- */
let letzteStation = -1, lageAktiv = -1;

function takt() {
  const t = quelle.currentTime;

  let i = 0;
  for (let n = 0; n < KONFIG.stationen.length; n++) if (t >= KONFIG.stationen[n].ab) i = n;
  if (i !== letzteStation && !justierAn) {
    letzteStation = i;
    station = KONFIG.stationen[i];
    fahreZu(station);
    schilder.forEach((d, n) => { if (d) d.classList.toggle("an", n === i); });
  }

  let treffer = 0;
  for (let n = 0; n < KONFIG.lage.length; n++) if (t >= KONFIG.lage[n].ab) treffer = n;
  if (treffer !== lageAktiv) {
    lageAktiv = treffer;
    const k = el("lage"), g = KONFIG.lage[treffer];
    if (!g.titel) k.classList.remove("an");
    else {
      k.querySelector("b").textContent    = g.titel;
      k.querySelector("span").textContent = g.zusatz;
      k.classList.add("an");
    }
  }

  el("binde").classList.toggle("sichtbar", t >= KONFIG.binde.ein && t < KONFIG.binde.aus);

  const d = quelle.duration && isFinite(quelle.duration) ? quelle.duration : 0;
  el("leiste-zeit").textContent = t.toFixed(1) + " / " + d.toFixed(1);
  el("leiste-füll").style.width = d ? (t / d * 100) + "%" : "0";

  requestAnimationFrame(takt);
}

/* ---------- Ablauf ---------- */
function start() {
  el("start").classList.add("weg");
  el("kennung").classList.add("sichtbar");
  if (leisteAn) el("leiste").classList.add("zeig");
  letzteStation = -1; lageAktiv = -1;
  quelle.currentTime = 0;
  quelle.play().catch(() => {});
  baueMarker();
  requestAnimationFrame(takt);
}
el("start-knopf").addEventListener("click", start);
el("start").addEventListener("click", (e) => { if (e.target.closest("label")) return; start(); });
el("datei").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) { quelle.src = URL.createObjectURL(f); quelle.load(); }
});
el("knopf-video").addEventListener("click", () => el("datei").click());

/* ---------- Zeitleiste ---------- */
const spur = el("leiste-spur");
function baueMarker() {
  spur.querySelectorAll(".marker").forEach(m => m.remove());
  if (!quelle.duration || !isFinite(quelle.duration)) return;
  KONFIG.stationen.forEach(s => {
    const k = document.createElement("span");
    k.className = "marker";
    k.style.left = (s.ab / quelle.duration * 100) + "%";
    spur.appendChild(k);
  });
}
spur.addEventListener("click", (e) => {
  if (!quelle.duration || !isFinite(quelle.duration)) return;
  const r = spur.getBoundingClientRect();
  springe(((e.clientX - r.left) / r.width) * quelle.duration);
});
function springe(sek) {
  quelle.currentTime = Math.max(0, Math.min(sek, quelle.duration || sek));
  letzteStation = -1; lageAktiv = -1;
  if (quelle.paused) quelle.play().catch(() => {});
}

/* ---------- Zeiten-Editor ---------- */
function sek(v) { return Math.round(v * 10) / 10; }

function baueZeiten() {
  const liste = el("zeiten-liste");
  liste.innerHTML = "";

  KONFIG.stationen.forEach((s, i) => {
    const z = document.createElement("div");
    z.className = "zeile"; z.dataset.art = "station"; z.dataset.i = String(i);
    const titel = s.name || (s.wetter ? "Nur " + s.wetter : "Übersicht");
    z.innerHTML = '<span class="titel">' + titel +
      '<small>ab ' + s.ab.toFixed(1) + ' s · Zoom ' + s.zoom + (s.wetter ? ' · ' + s.wetter : '') + '</small></span>';
    const a = document.createElement("button"); a.textContent = "jetzt";
    a.title = "Fahrt, Schild und Wetter auf die laufende Sekunde setzen";
    a.addEventListener("click", () => { s.ab = sek(quelle.currentTime); aktualisiere(); });
    const v = document.createElement("button"); v.textContent = "→";
    v.title = "Dorthin springen";
    v.addEventListener("click", () => springe(s.ab + 0.2));
    z.appendChild(a); z.appendChild(v);
    liste.appendChild(z);
  });

  KONFIG.lage.forEach((l, i) => {
    const z = document.createElement("div");
    z.className = "zeile"; z.dataset.art = "lage"; z.dataset.i = String(i);
    z.innerHTML = '<span class="titel">Tafel: ' + (l.titel || "— keine —") +
      '<small>ab ' + l.ab.toFixed(1) + ' s</small></span>';
    const a = document.createElement("button"); a.textContent = "jetzt";
    a.addEventListener("click", () => { l.ab = sek(quelle.currentTime); aktualisiere(); });
    const v = document.createElement("button"); v.textContent = "→";
    v.addEventListener("click", () => springe(l.ab + 0.2));
    z.appendChild(a); z.appendChild(v);
    liste.appendChild(z);
  });
}

function aktualisiere() {
  KONFIG.stationen.sort((a, b) => a.ab - b.ab);
  KONFIG.lage.sort((a, b) => a.ab - b.ab);
  baueZeiten(); baueMarker();
  letzteStation = -1; lageAktiv = -1;
  schreibeAusgabe();
}

function schreibeAusgabe() {
  const s = KONFIG.stationen.map(x =>
    '    { ab: ' + x.ab + ', name: "' + x.name + '", x: ' + x.x + ', y: ' + x.y + ', zoom: ' + x.zoom +
    ',\n      wert: "' + x.wert + '", zusatz: "' + x.zusatz + '", art: "' + x.art +
    '", wetter: "' + x.wetter + '", weite: ' + x.weite + ' },').join("\n");
  const l = KONFIG.lage.map(x =>
    '    { ab: ' + x.ab + ', titel: "' + x.titel + '", zusatz: "' + x.zusatz + '" },').join("\n");
  el("zeiten-text").value = "stationen: [\n" + s + "\n  ],\n\n  lage: [\n" + l + "\n  ]";
}

el("zeiten-ausgabe").addEventListener("click", () => {
  el("zeiten").classList.toggle("ausgabe");
  schreibeAusgabe();
  const f = el("zeiten-text");
  if (el("zeiten").classList.contains("ausgabe")) { f.focus(); f.select(); }
});

setInterval(() => {
  if (!zeitenAn) return;
  const t = quelle.currentTime;
  el("zeiten").querySelectorAll(".zeile").forEach(z => {
    const i = +z.dataset.i;
    const an = z.dataset.art === "station"
      ? (i === letzteStation)
      : (i === lageAktiv);
    z.classList.toggle("jetzt", an);
  });
}, 200);

/* ---------- Ausrichten ---------- */
const bühne = document.querySelector(".bühne");
const werte = { "--art-rechts": 0.0, "--art-unten": 0.0, "--art-höhe": 84.0 };
const schlüssel = Object.keys(werte);
let zielIndex = 0, zieht = null;

function setzeWert(k, v) {
  werte[k] = v;
  document.documentElement.style.setProperty(k, v.toFixed(1) + "%");
}
document.addEventListener("pointerdown", (e) => {
  if (!justierAn) return;
  const r = bühne.getBoundingClientRect();
  const schild = e.target.closest(".ort");
  if (schild) {
    const i = +schild.dataset.i;
    zieht = { art: "ort", i, mx: e.clientX, my: e.clientY, bw: r.width, bh: r.height,
              x: KONFIG.stationen[i].x, y: KONFIG.stationen[i].y };
    e.preventDefault(); return;
  }
  if (e.target === artjom) {
    zieht = { art: "artjom", mx: e.clientX, my: e.clientY, bw: r.width, bh: r.height,
              x: werte["--art-rechts"], y: werte["--art-unten"] };
    e.preventDefault();
  }
});
document.addEventListener("pointermove", (e) => {
  if (!zieht) return;
  const dx = (e.clientX - zieht.mx) / zieht.bw * 100;
  const dy = (e.clientY - zieht.my) / zieht.bh * 100;
  if (zieht.art === "ort") {
    const s = KONFIG.stationen[zieht.i];
    s.x = zieht.x + dx / 1.04; s.y = zieht.y + dy / 1.04;
    schilder[zieht.i].style.left = s.x.toFixed(1) + "%";
    schilder[zieht.i].style.top  = s.y.toFixed(1) + "%";
  } else {
    setzeWert("--art-rechts", zieht.x - dx);
    setzeWert("--art-unten",  zieht.y - dy);
  }
  zeichneJustier();
});
document.addEventListener("pointerup", () => { zieht = null; });

function zeichneJustier() {
  const zeilen = schlüssel.map((k, i) =>
    (i === zielIndex ? "\u25B8 " : "  ") + k.padEnd(14) + werte[k].toFixed(1) + "%").join("\n");
  const css  = schlüssel.map(k => "  " + k + ": " + werte[k].toFixed(1) + "%;").join("\n");
  const orte = KONFIG.stationen.filter(s => s.name)
    .map(s => "  " + s.name.padEnd(18) + s.x.toFixed(1) + " / " + s.y.toFixed(1)).join("\n");
  el("justier").innerHTML =
    "<b>Ausrichtemodus</b>  Schilder und Artjom ziehen  ·  Tab wechselt  ·  C zeigt die Werte  ·  J schliesst\n"
    + zeilen + "\n\n" + orte + "<code>:root {\n" + css + "\n}</code>";
}
function justierUm() {
  justierAn = !justierAn;
  el("justier").classList.toggle("zeig", justierAn);
  document.body.classList.toggle("justiert", justierAn);
  if (justierAn) {
    document.documentElement.style.setProperty("--gegen", "1");
    schilder.forEach(d => { if (d) d.classList.add("an"); });
    zeichneJustier();
  } else letzteStation = -1;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "j" || e.key === "J") { e.preventDefault(); justierUm(); return; }
  if ((e.key === "c" || e.key === "C") && justierAn) {
    e.preventDefault(); el("justier").classList.toggle("werte-zeigen"); return;
  }
  if (justierAn) {
    if (e.key === "Tab") {
      e.preventDefault();
      zielIndex = (zielIndex + (e.shiftKey ? -1 : 1) + schlüssel.length) % schlüssel.length;
      zeichneJustier(); return;
    }
    const schritt = e.shiftKey ? 1.0 : 0.1;
    const k = schlüssel[zielIndex];
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setzeWert(k, werte[k] - schritt); zeichneJustier(); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp")  { e.preventDefault(); setzeWert(k, werte[k] + schritt); zeichneJustier(); }
    return;
  }
  if (e.key === "z" || e.key === "Z") {
    e.preventDefault(); zeitenAn = !zeitenAn;
    el("zeiten").classList.toggle("zeig", zeitenAn);
    if (zeitenAn) baueZeiten();
    return;
  }
  if (e.key === "t" || e.key === "T") {
    e.preventDefault(); leisteAn = !leisteAn;
    el("leiste").classList.toggle("zeig", leisteAn); return;
  }
  if (e.code === "Space") { e.preventDefault(); quelle.paused ? quelle.play() : quelle.pause(); }
  const weite = e.shiftKey ? 1 : 5;
  if (e.key === "ArrowRight") { e.preventDefault(); springe(quelle.currentTime + weite); }
  if (e.key === "ArrowLeft")  { e.preventDefault(); springe(quelle.currentTime - weite); }
  if (e.key === "r" || e.key === "R") {
    quelle.pause(); letzteStation = -1; lageAktiv = -1;
    el("kennung").classList.remove("sichtbar");
    el("binde").classList.remove("sichtbar");
    el("start").classList.remove("weg");
  }
});
</script>
</body>
